<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WhatsApp RPG AI</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111827;
      color: white;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    main {
      width: min(92%, 430px);
      background: #1f2937;
      padding: 24px;
      border-radius: 18px;
      box-sizing: border-box;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      border: 0;
      font-size: 16px;
    }
    button { cursor: pointer; }
    #code {
      font-size: 28px;
      letter-spacing: 5px;
      text-align: center;
      margin: 20px 0;
    }
    .status { margin: 12px 0; }
    small { color: #cbd5e1; }
  </style>
</head>
<body>
<main>
  <h1>🎲 WhatsApp RPG AI</h1>
  <p class="status">Status: <strong id="status">carregando...</strong></p>

  <label for="phone">Número do WhatsApp</label>
  <input id="phone" inputmode="numeric"
         placeholder="5511999999999">

  <button id="connect">Gerar código de pareamento</button>

  <div id="code"></div>
  <small id="message">
    Digite o número com código do país, DDD e número, somente dígitos.
  </small>
</main>

<script>
async function refreshStatus() {
  try {
    const r = await fetch("/api/status");
    const data = await r.json();
    document.querySelector("#status").textContent =
      data.connected ? "🟢 conectado" : data.state;
  } catch {
    document.querySelector("#status").textContent = "servidor indisponível";
  }
}

document.querySelector("#connect").onclick = async () => {
  const phone = document.querySelector("#phone").value;
  const codeBox = document.querySelector("#code");
  const message = document.querySelector("#message");

  codeBox.textContent = "Gerando...";
  message.textContent = "";

  try {
    const r = await fetch("/api/pairing-code", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ phone })
    });

    const data = await r.json();

    if (!data.ok) {
      throw new Error(data.error || "Erro desconhecido");
    }

    codeBox.textContent = data.code;
    message.textContent =
      "Use esse código no WhatsApp para vincular o aparelho.";
  } catch (e) {
    codeBox.textContent = "";
    message.textContent = e.message;
  }
};

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
